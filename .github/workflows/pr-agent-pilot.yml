# PR Agent pilot workflow (Route A: free-model PR review).
# Pilot scope: this file exists only on the pilot branch. It is NOT merged
# to main until the review run on the pilot PR itself is verified.
# Safety gates for Route A:
# - triggers only on opened / reopened / ready_for_review (no synchronize),
#   so one pilot PR gets exactly one auto review comment
# - bot senders skipped
# - runtime image pinned by digest, never a rolling tag
# - auto-approval is OFF in .pr_agent.toml
# - all models are :free with multi-provider fallback; fail-closed on exhaustion
name: PR Agent (pilot)

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    name: Run PR Agent (free-model pilot)
    steps:
      - name: PR Agent action step
        uses: docker://pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review"]'
          # No config branch here on purpose: on main, repo settings are read
          # from the default branch, which is main itself. (The pilot branch
          # needed PR_AGENT_CONFIG_BRANCH only because its config was not on
          # main yet; that variable was removed before merge.)
          # Only the review tool runs: describe would rewrite the PR body and
          # code suggestions would add more comments. One PR, one review comment.
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
